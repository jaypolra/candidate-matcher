<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Candidate Matcher workflow</title>
  <desc id="desc">Workflow diagram showing job description and resumes moving through parsing, embeddings, cosine ranking, LLM summaries, and recruiter results.</desc>
  <rect width="1200" height="520" rx="24" fill="#F7FAFC"/>
  <rect x="36" y="36" width="1128" height="448" rx="20" fill="#FFFFFF" stroke="#D9E2EC"/>

  <text x="72" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#102A43">Candidate Recommendation Engine</text>
  <text x="72" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#52606D">Semantic resume ranking with embeddings, cosine similarity, and recruiter-ready LLM summaries</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102A43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#486581"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="74" y="184" width="174" height="102" rx="14" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="161" y="226" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0C4A6E">Job</text>
    <text x="161" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#075985">description</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="328" width="174" height="102" rx="14" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="161" y="370" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">Resumes</text>
    <text x="161" y="396" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#15803D">PDF / DOCX / TXT</text>
  </g>

  <line x1="250" y1="235" x2="318" y2="285" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="250" y1="379" x2="318" y2="335" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="330" y="234" width="174" height="120" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="417" y="279" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#9A3412">Parsing</text>
    <text x="417" y="306" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#C2410C">clean text</text>
    <text x="417" y="329" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#C2410C">fallbacks</text>
  </g>

  <line x1="506" y1="294" x2="574" y2="294" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="586" y="234" width="190" height="120" rx="14" fill="#EEF2FF" stroke="#A5B4FC"/>
    <text x="681" y="279" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#3730A3">MiniLM</text>
    <text x="681" y="306" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#4338CA">semantic</text>
    <text x="681" y="329" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#4338CA">embeddings</text>
  </g>

  <line x1="778" y1="294" x2="846" y2="294" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="858" y="234" width="174" height="120" rx="14" fill="#FDF2F8" stroke="#F9A8D4"/>
    <text x="945" y="279" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#9D174D">Cosine</text>
    <text x="945" y="306" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#BE185D">similarity</text>
    <text x="945" y="329" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#BE185D">ranking</text>
  </g>

  <line x1="1034" y1="294" x2="1076" y2="294" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1068" y="184" width="56" height="220" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="1096" y="226" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" transform="rotate(90 1096 226)">Results</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="858" y="388" width="266" height="56" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="991" y="423" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#334155">Gemma / Flan-T5 summaries</text>
  </g>

  <line x1="945" y1="356" x2="945" y2="379" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1032" y1="416" x2="1060" y2="342" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
